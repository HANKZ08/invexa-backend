name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invexa
          POSTGRES_USER: invexa
          POSTGRES_PASSWORD: invexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_NAME: invexa
      DB_USER: invexa
      DB_PASSWORD: invexa
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run

      - name: Esquema OpenAPI válido
        run: python manage.py spectacular --validate --fail-on-warn --file schema.yml

      - name: Checklist de despliegue de Django
        env:
          DEBUG: "False"
          SECRET_KEY: ${{ github.run_id }}-ci-only-long-random-secret-key-for-deploy-check-xyz
        run: python manage.py check --deploy --fail-level WARNING

      - name: Vulnerabilidades en dependencias
        run: pip-audit -r requirements/base.txt

      - name: Tests
        run: pytest --create-db --cov --cov-report=term-missing --cov-fail-under=90
